name: Import Rolling Dents upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout approved upstream
        uses: actions/checkout@v4
        with:
          repository: PDthePlug/Rolling-Dents
          ref: main
          path: _upstream
          fetch-depth: 1

      - name: Import and prove exact upstream working tree
        id: import
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C _upstream rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git -C _upstream rev-parse HEAD^{tree})"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='_upstream/' \
            --exclude='PROVENANCE.md' \
            --exclude='.github/workflows/import-upstream.yml' \
            _upstream/ ./

          (
            cd _upstream
            find . -type f ! -path './.git/*' -print0 | sort -z | xargs -0 sha256sum
          ) > /tmp/upstream.sha256
          (
            find . -type f \
              ! -path './.git/*' \
              ! -path './_upstream/*' \
              ! -path './PROVENANCE.md' \
              ! -path './.github/workflows/import-upstream.yml' \
              -print0 | sort -z | xargs -0 sha256sum
          ) > /tmp/production.sha256
          diff -u /tmp/upstream.sha256 /tmp/production.sha256
          echo 'Exact file-by-file SHA-256 parity confirmed.'
          rm -rf _upstream

          cat > PROVENANCE.md <<EOF
          # Rolling Dents Production Master — Provenance

          Source repository: \`PDthePlug/Rolling-Dents\`
          Source branch: \`main\`
          Source commit SHA: \`${SOURCE_SHA}\`
          Source tree SHA: \`${SOURCE_TREE_SHA}\`
          Production-master repository: \`PDthePlug/Rolling-Dents-Production-Master\`

          This repository is the independent PDCONNECT production-hardening track. The engineer's source repository remains upstream and is not modified by Production Master work unless explicitly requested.

          The import is an exact working-tree copy of the approved upstream at the commit above. File-by-file SHA-256 parity is checked before the import is committed. This provenance file and the import workflow are the only Production Master control files intentionally outside upstream parity.
          EOF
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_tree_sha=${SOURCE_TREE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No upstream changes to import.'
          else
            git commit -m "chore: import Rolling-Dents upstream ${{ steps.import.outputs.source_sha }}"
            git push origin HEAD:main
          fi

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Lint baseline
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build and test baseline
        id: test
        continue-on-error: true
        run: npm test

      - name: Baseline verification verdict
        if: always()
        shell: bash
        run: |
          echo "Upstream commit: ${{ steps.import.outputs.source_sha }}"
          echo "Upstream tree:   ${{ steps.import.outputs.source_tree_sha }}"
          echo "Lint outcome:    ${{ steps.lint.outcome }}"
          echo "Test outcome:    ${{ steps.test.outcome }}"
          if [[ "${{ steps.lint.outcome }}" != 'success' || "${{ steps.test.outcome }}" != 'success' ]]; then
            exit 1
          fi
