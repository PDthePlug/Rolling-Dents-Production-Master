name: Dependency Security Audit

on:
  push:
    branches: [audit/dependency-security]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > production-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('production-audit.json','utf8'));
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: report.vulnerabilities }, null, 2));
          NODE
      - name: Full dependency audit
        run: |
          npm audit --json > full-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('full-audit.json','utf8'));
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: report.vulnerabilities }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rolling-dents-dependency-audit
          path: |
            production-audit.json
            full-audit.json
